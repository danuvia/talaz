[package]
name = "talaz"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
ureq = "3"
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# starting Minecraft and loading the mod into it
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Threading"] }

# Release builds strip debug info by default, and stripping the proc macro dylibs with
# Xcode's new tools leaves them unloadable on this Mac; the app itself is still stripped
[profile.release.build-override]
strip = "none"
