[package]
name = "talaz"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = "2"
ureq = "3"
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# the notch's height, from the screen's safe area
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSScreen"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }
