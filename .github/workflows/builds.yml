# Every push to main builds Talaz for Windows and Linux, the mods first and then the
# launcher, and leaves the installer and the AppImage on the run as artifacts for testing.
name: Builds

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # the mods are a private repository until Talaz goes public, which the run's own
      # token can't read; MODS_TOKEN reads only that one
      - name: Check out the mods
        shell: bash
        run: |
          git config --global url."https://x-access-token:${{ secrets.MODS_TOKEN }}@github.com/danuvia/talaz-mods".insteadOf https://github.com/danuvia/talaz-mods
          git submodule update --init --depth 1

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja

      - name: Build the mods
        shell: msys2 {0}
        run: |
          cmake -S mod -B mod/build/windows -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build mod/build/windows

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the launcher
        working-directory: app/src-tauri
        run: |
          cargo install tauri-cli --version "^2" --locked
          cargo tauri build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - uses: actions/upload-artifact@v4
        with:
          name: talaz-windows
          path: app/src-tauri/target/release/bundle/nsis/*.exe

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Check out the mods
        run: |
          git config --global url."https://x-access-token:${{ secrets.MODS_TOKEN }}@github.com/danuvia/talaz-mods".insteadOf https://github.com/danuvia/talaz-mods
          git submodule update --init --depth 1

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      - name: Build the mods
        run: |
          cmake -S mod -B mod/build/x86_64 \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=x86_64 -DANDROID_PLATFORM=android-28 -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release
          cmake --build mod/build/x86_64 -j4

      - name: Install what Tauri needs
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the launcher
        working-directory: app/src-tauri
        run: |
          cargo install tauri-cli --version "^2" --locked
          cargo tauri build --bundles appimage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - uses: actions/upload-artifact@v4
        with:
          name: talaz-linux
          path: app/src-tauri/target/release/bundle/appimage/*.AppImage
