# Every push to main builds Talaz for Windows: the mod DLL with mingw-w64, then the
# launcher's installer. The installer is left on the run as an artifact for testing.
name: Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # the mods are a private repository until Talaz goes public, which the run's own
      # token can't read; MODS_TOKEN reads only that one
      - name: Check out the mods
        shell: bash
        run: |
          git config --global url."https://x-access-token:${{ secrets.MODS_TOKEN }}@github.com/danuvia/talaz-mods".insteadOf https://github.com/danuvia/talaz-mods
          git submodule update --init --depth 1

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja

      - name: Build the mods
        shell: msys2 {0}
        run: |
          cmake -S mod -B mod/build/windows -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build mod/build/windows

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the launcher
        working-directory: app/src-tauri
        run: |
          cargo install tauri-cli --version "^2" --locked
          cargo tauri build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - uses: actions/upload-artifact@v4
        with:
          name: talaz-windows
          path: app/src-tauri/target/release/bundle/nsis/*.exe
